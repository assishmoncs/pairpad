services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: pairpad
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  execution-worker:
    build:
      context: ./execution-worker
    user: root
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 7000
      EXECUTION_WORKER_TOKEN: ${EXECUTION_WORKER_TOKEN:?Set EXECUTION_WORKER_TOKEN in the environment before starting PairPad}
      EXECUTION_TIMEOUT_MS: ${EXECUTION_TIMEOUT_MS:-5000}
      MAX_OUTPUT_BYTES: ${MAX_OUTPUT_BYTES:-1048576}
      MAX_SOURCE_BYTES: ${MAX_SOURCE_BYTES:-524288}
      EXECUTION_MEMORY: ${EXECUTION_MEMORY:-128m}
      EXECUTION_CPUS: ${EXECUTION_CPUS:-0.5}
      EXECUTION_PIDS_LIMIT: ${EXECUTION_PIDS_LIMIT:-64}
      EXECUTION_NETWORK: none
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7000/health | grep ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      LOG_LEVEL: info
      MONGODB_URI: mongodb://mongodb:27017/pairpad
      REDIS_URL: redis://redis:6379
      REDIS_REQUIRED: "true"
      PRESENCE_NODE_ID: ${PRESENCE_NODE_ID:-compose-backend}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment before starting PairPad}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-pairpad_refresh}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      JUDGE0_BASE_URL: ${JUDGE0_BASE_URL:-https://judge0-ce.p.rapidapi.com}
      JUDGE0_API_KEY: ${JUDGE0_API_KEY:-}
      JUDGE0_RAPIDAPI_HOST: ${JUDGE0_RAPIDAPI_HOST:-judge0-ce.p.rapidapi.com}
      EXECUTION_WORKER_URL: http://execution-worker:7000
      EXECUTION_WORKER_TOKEN: ${EXECUTION_WORKER_TOKEN:?Set EXECUTION_WORKER_TOKEN in the environment before starting PairPad}
      ALLOW_LOCAL_EXECUTION: "false"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      execution-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz | grep ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
  redis_data:
