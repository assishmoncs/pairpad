openapi: 3.1.0
info:
  title: PairPad API
  version: 1.1.0
  description: Authoritative REST contract for PairPad collaborative coding, workspaces, revisions, interviews, and execution.
servers:
  - url: http://localhost:5000
    description: Local development
  - url: https://api.example.com
    description: Production placeholder
security:
  - bearerAuth: []
tags:
  - { name: Authentication }
  - { name: Rooms }
  - { name: History }
  - { name: Workspace }
  - { name: Interview }
  - { name: Messages }
  - { name: Execution }
  - { name: Health }
paths:
  /health:
    get:
      tags: [Health]
      security: []
      responses:
        '200': { description: Liveness check }
  /ready:
    get:
      tags: [Health]
      security: []
      responses:
        '200': { description: Ready }
        '503': { $ref: '#/components/responses/NotReady' }
  /api/auth/register:
    post:
      tags: [Authentication]
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/AuthSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/auth/login:
    post:
      tags: [Authentication]
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/refresh:
    post:
      tags: [Authentication]
      security: []
      description: Rotates the HttpOnly refresh-token cookie and returns a new access token.
      responses:
        '200': { $ref: '#/components/responses/RefreshSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/logout:
    post:
      tags: [Authentication]
      security: []
      responses:
        '200': { description: Session revoked and cookie cleared }
  /api/auth/logout-all:
    post:
      tags: [Authentication]
      responses:
        '200': { description: All sessions revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/me:
    get:
      tags: [Authentication]
      responses:
        '200': { $ref: '#/components/responses/UserSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/rooms:
    get:
      tags: [Rooms]
      responses: { '200': { $ref: '#/components/responses/RoomsSuccess' } }
    post:
      tags: [Rooms]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateRoomRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/RoomSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/rooms/{identifier}:
    get:
      tags: [Rooms]
      parameters: [{ $ref: '#/components/parameters/Identifier' }]
      responses:
        '200': { $ref: '#/components/responses/RoomSuccess' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Rooms]
      parameters: [{ $ref: '#/components/parameters/Identifier' }]
      responses:
        '200': { description: Room deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/rooms/{roomCode}/join:
    post:
      tags: [Rooms]
      parameters: [{ $ref: '#/components/parameters/RoomCode' }]
      responses:
        '200': { $ref: '#/components/responses/RoomSuccess' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/rooms/{roomCode}/leave:
    post:
      tags: [Rooms]
      parameters: [{ $ref: '#/components/parameters/RoomCode' }]
      responses: { '200': { description: Left room } }
  /api/rooms/{roomCode}/members/{userId}/role:
    patch:
      tags: [Rooms]
      parameters:
        - { $ref: '#/components/parameters/RoomCode' }
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoleRequest' } } } }
      responses:
        '200': { description: Role updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/rooms/{roomCode}/transfer:
    post:
      tags: [Rooms]
      parameters: [{ $ref: '#/components/parameters/RoomCode' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransferRequest' } } } }
      responses:
        '200': { description: Ownership transferred }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/rooms/{roomCode}/history:
    get:
      tags: [History]
      parameters:
        - { $ref: '#/components/parameters/RoomCode' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: before, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Revision list }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [History]
      parameters: [{ $ref: '#/components/parameters/RoomCode' }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/RevisionRequest' } } } }
      responses:
        '201': { description: Checkpoint created }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/rooms/{roomCode}/history/diff:
    get:
      tags: [History]
      parameters:
        - { $ref: '#/components/parameters/RoomCode' }
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Revision comparison }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/rooms/{roomCode}/history/{revisionId}/restore:
    post:
      tags: [History]
      parameters:
        - { $ref: '#/components/parameters/RoomCode' }
        - { name: revisionId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Revision restored }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/rooms/{roomCode}/files:
    get:
      tags: [Workspace]
      parameters: [{ $ref: '#/components/parameters/RoomCode' }]
      responses:
        '200': { description: Workspace file list }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Workspace]
      parameters: [{ $ref: '#/components/parameters/RoomCode' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkspaceFileRequest' }
      responses:
        '201': { description: Workspace file created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/rooms/{roomCode}/files/{fileId}:
    get:
      tags: [Workspace]
      parameters:
        - { $ref: '#/components/parameters/RoomCode' }
        - { $ref: '#/components/parameters/FileId' }
      responses:
        '200': { description: Workspace file }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Workspace]
      parameters:
        - { $ref: '#/components/parameters/RoomCode' }
        - { $ref: '#/components/parameters/FileId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameWorkspaceFileRequest' }
      responses:
        '200': { description: Workspace file renamed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Workspace]
      parameters:
        - { $ref: '#/components/parameters/RoomCode' }
        - { $ref: '#/components/parameters/FileId' }
      responses:
        '200': { description: Workspace file deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/rooms/{roomCode}/interview:
    get:
      tags: [Interview]
      parameters: [{ $ref: '#/components/parameters/RoomCode' }]
      responses:
        '200': { description: Member-safe interview state }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Interview]
      parameters: [{ $ref: '#/components/parameters/RoomCode' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InterviewConfig' }
      responses:
        '200': { description: Interview configured }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/rooms/{roomCode}/interview/start:
    post:
      tags: [Interview]
      parameters: [{ $ref: '#/components/parameters/RoomCode' }]
      responses:
        '200': { description: Interview started }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/rooms/{roomCode}/interview/pause:
    post:
      tags: [Interview]
      parameters: [{ $ref: '#/components/parameters/RoomCode' }]
      responses:
        '200': { description: Interview paused }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/rooms/{roomCode}/interview/resume:
    post:
      tags: [Interview]
      parameters: [{ $ref: '#/components/parameters/RoomCode' }]
      responses:
        '200': { description: Interview resumed }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/rooms/{roomCode}/interview/end:
    post:
      tags: [Interview]
      parameters: [{ $ref: '#/components/parameters/RoomCode' }]
      responses:
        '200': { description: Interview ended }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/rooms/{roomCode}/interview/submit:
    post:
      tags: [Interview]
      parameters: [{ $ref: '#/components/parameters/RoomCode' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceCode, language]
              properties:
                sourceCode: { type: string, maxLength: 51200 }
                language: { type: string }
      responses:
        '200': { description: Public results plus redacted hidden-test results }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/messages/room/{roomCode}:
    get:
      tags: [Messages]
      parameters:
        - { $ref: '#/components/parameters/RoomCode' }
        - { name: before, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Paginated room messages }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/execute:
    post:
      tags: [Execution]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecuteRequest' }
      responses:
        '200': { description: Execution result }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '408': { description: Execution timed out }
        '429': { description: Rate limit exceeded }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    RoomCode: { name: roomCode, in: path, required: true, schema: { type: string, pattern: '^[A-Z0-9]{6}$' } }
    Identifier: { name: identifier, in: path, required: true, schema: { type: string } }
    FileId: { name: fileId, in: path, required: true, schema: { type: string } }
  schemas:
    User:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 50 }
        email: { type: string, format: email }
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, format: email }
        password: { type: string, minLength: 6, maxLength: 128, format: password }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 6, maxLength: 128, format: password }
    CreateRoomRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        language: { type: string }
        description: { type: string, maxLength: 200 }
    RoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [editor, viewer] }
    TransferRequest:
      type: object
      required: [newOwnerId]
      properties:
        newOwnerId: { type: string }
    RevisionRequest:
      type: object
      properties:
        content: { type: string, maxLength: 524288 }
        language: { type: string }
        message: { type: string, maxLength: 120 }
    CreateWorkspaceFileRequest:
      type: object
      required: [path]
      properties:
        path: { type: string, minLength: 1, maxLength: 240 }
        language: { type: string }
        content: { type: string, maxLength: 524288 }
    RenameWorkspaceFileRequest:
      type: object
      required: [path]
      properties:
        path: { type: string, minLength: 1, maxLength: 240 }
    InterviewTest:
      type: object
      required: [name, stdin, expectedOutput]
      properties:
        name: { type: string, maxLength: 100 }
        stdin: { type: string, maxLength: 10000 }
        expectedOutput: { type: string, maxLength: 10000 }
    InterviewConfig:
      type: object
      required: [title, description, durationMinutes, language]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 5000 }
        durationMinutes: { type: integer, minimum: 1, maximum: 1440 }
        language: { type: string, enum: [javascript, python, java, cpp, c, go, rust, typescript, php, ruby] }
        candidateId: { type: [string, 'null'] }
        publicTests: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/InterviewTest' } }
        hiddenTests: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/InterviewTest' } }
    ExecuteRequest:
      type: object
      required: [source_code, language, roomCode]
      properties:
        source_code: { type: string, maxLength: 524288 }
        language: { type: string }
        stdin: { type: string, maxLength: 10000 }
        roomCode: { type: string, pattern: '^[A-Z0-9]{6}$' }
        fileId: { type: string }
    ApiError:
      type: object
      properties:
        status: { type: string }
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
    AuthSuccess:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        token: { type: string }
    RefreshSuccess:
      type: object
      properties:
        token: { type: string }
    UserSuccess:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
    RoomSuccess:
      type: object
      properties:
        room: { type: object }
    RoomsSuccess:
      type: object
      properties:
        rooms: { type: array, items: { type: object } }
  responses:
    AuthSuccess: { description: Authenticated session created, content: { application/json: { schema: { $ref: '#/components/schemas/AuthSuccess' } } } }
    RefreshSuccess: { description: New access token; refresh token rotates in HttpOnly cookie, content: { application/json: { schema: { $ref: '#/components/schemas/RefreshSuccess' } } } }
    UserSuccess: { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/UserSuccess' } } } }
    RoomSuccess: { description: Room payload, content: { application/json: { schema: { $ref: '#/components/schemas/RoomSuccess' } } } }
    RoomsSuccess: { description: Room list, content: { application/json: { schema: { $ref: '#/components/schemas/RoomsSuccess' } } } }
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    Unauthorized: { description: Authentication required or invalid credentials, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    Forbidden: { description: Insufficient permission, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    Conflict: { description: Resource conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    NotReady: { description: Service dependency not ready, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
